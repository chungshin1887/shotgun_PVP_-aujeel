<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PVP Dungeon</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml, <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
<path d='M12 38 Q12 30 20 30 H65 L88 42 H65 V50

             H53

             L48 75

             H32

             L37 50

             H20

             Q12 50 12 42

             Z'

          fill='%23000000'/>

    <rect x='68' y='36' width='20' height='8' rx='2'

          fill='%23000000'/>

</svg>">
</head>

<body>

    <div id="intro">
        <h1>PVP DUNGEON</h1>
        <p>RETRO FIRST PERSON SHOOTER</p>
        <button id="startButton">💻 PC로 플레이</button>
    </div>

    <div id="game">
        <div id="crosshair">+</div>

        <div id="hud">
            <div>HP <span id="hp">100</span></div>
            <div>ENEMIES <span id="enemyCount">0</span></div>
            <div>AMMO <span id="ammo">12</span> / 12</div>
        </div>

        <div id="message"></div>

        <div id="gameover">
            <h1>GAME OVER</h1>
            <button onclick="location.reload()">RESTART</button>
        </div>
    </div>

    <script type="module" src="./src/main.js"></script>

</body>
</html>
