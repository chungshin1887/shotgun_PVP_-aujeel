
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="https://www.google.com/imgres?q=%EC%B4%9D%20%EB%AA%A8%EC%96%91%20%EC%9D%B4%EB%AA%A8%ED%8B%B0%EC%BD%98&imgurl=https%3A%2F%2Fcdn-icons-png.flaticon.com%2F512%2F3857%2F3857449.png&imgrefurl=https%3A%2F%2Fwww.flaticon.com%2Fkr%2Ffree-icon%2Fsniper-rifle_3857449&docid=urs3DimXCFStdM&tbnid=DfDAgSZuVdm_xM&vet=12ahUKEwiSwvH46_6XAxU5kOEIHTN-GksQnPAOegUI5QQQAA..i&w=512&h=512&hcb=2&ved=2ahUKEwiSwvH46_6XAxU5kOEIHTN-GksQnPAOegUI5QQQAA/favicon.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PVP Dungeon</title>

    <link rel="stylesheet" href="style.css">

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
    }
    </script>
</head>
<body>

    <!-- 3D 게임 화면 -->
    <div id="game-container"></div>

    <!-- 미니맵 -->
    <canvas id="minimap" width="180" height="180"></canvas>

    <!-- HUD -->
    <div id="hud">

        <div class="hud-left">

            <div class="status-box">
                <span>HEALTH</span>
                <span id="health">100</span>
            </div>

            <div class="status-box">
                <span>AMMO</span>
                <span id="ammo">12 / 60</span>
            </div>

            <div class="status-box">
                <span>ENEMIES</span>
                <span id="enemy-count">5</span>
            </div>

        </div>

        <div id="crosshair">+</div>

        <div id="message"></div>

    </div>

    <!-- 시작 / 일시정지 / 종료 화면 -->
    <div id="overlay">

        <div class="screen-content">

            <h1 id="menu-title">PVP DUNGEON</h1>

            <p id="menu-description">
                RETRO FIRST PERSON SHOOTER
            </p>

            <button id="start-button">
                START GAME
            </button>

            <button id="resume-button" class="hidden">
                RESUME
            </button>

            <button id="restart-button" class="hidden">
                RESTART
            </button>

            <div class="controls">
                <p>W A S D : MOVE</p>
                <p>ARROW KEYS : TURN</p>
                <p>SPACE : SHOOT</p>
                <p>R : RELOAD</p>
                <p>ESC : PAUSE</p>
            </div>

        </div>

    </div>

    <!-- 게임 JS -->
    <script type="module" src="src/main.js"></script>

</body>
</html>
