<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PVP Dungeon</title>
    <link rel="stylesheet" href="style.css">

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
    }
    </script>
</head>

<body>
    <div id="game-container"></div>

    <div id="hud">
        <div class="hud-left">
            <div class="hud-box">
                <span>HEALTH</span>
                <strong id="health">100</strong>
            </div>
            <div class="hud-box">
                <span>ENEMIES</span>
                <strong id="enemy-count">0</strong>
            </div>
        </div>

        <div class="hud-right">
            <div class="hud-box">
                <span>AMMO</span>
                <strong id="ammo">12 / 60</strong>
            </div>
        </div>

        <div id="crosshair">+</div>
        <div id="message"></div>
    </div>

    <div id="overlay">
        <div class="menu">
            <h1 id="menu-title">PVP DUNGEON</h1>
            <p id="menu-description">RETRO FIRST PERSON DUNGEON SHOOTER</p>

            <button id="start-button">START GAME</button>
            <button id="resume-button" class="hidden">RESUME</button>
            <button id="restart-button" class="hidden">RESTART</button>

            <div class="controls">
                <p>WASD : MOVE</p>
                <p>← → : TURN VIEW</p>
                <p>SPACE : SHOOT</p>
                <p>R : RELOAD</p>
                <p>ESC : PAUSE</p>
            </div>
        </div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
